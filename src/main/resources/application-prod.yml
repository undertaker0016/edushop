spring:
  datasource:
    url: ${EDUSHOP_DB_URL}
    username: ${EDUSHOP_DB_USERNAME}
    password: ${EDUSHOP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

security:
  jwt:
    secret-base64: ${EDUSHOP_JWT_SECRET_BASE64}
    issuer: ${EDUSHOP_JWT_ISSUER:edushop}
    access-token-ttl: ${EDUSHOP_JWT_ACCESS_TOKEN_TTL:PT15M}

payment:
  mode: ${EDUSHOP_PAYMENT_MODE:UNAVAILABLE}
  webhook:
    secret: ${EDUSHOP_PAYMENT_WEBHOOK_SECRET:}

edushop:
  cors:
    allowed-origins: ${EDUSHOP_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
