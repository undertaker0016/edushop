spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/edushop_test?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8"
    username: ${EDUSHOP_TEST_DB_USERNAME:root}
    password: ${EDUSHOP_TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate