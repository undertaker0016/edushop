spring.application.name=edushop
spring.profiles.default=dev

# Local MySQL defaults. Override EDUSHOP_DB_USERNAME and EDUSHOP_DB_PASSWORD when deployed.
spring.datasource.url=${EDUSHOP_DB_URL:jdbc:mysql://localhost:3306/edushop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${EDUSHOP_DB_USERNAME:root}
spring.datasource.password=${EDUSHOP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Local fallback is for development only. Use EDUSHOP_JWT_SECRET_BASE64 in deployed environments.
security.jwt.secret-base64=${EDUSHOP_JWT_SECRET_BASE64:}
security.jwt.issuer=${EDUSHOP_JWT_ISSUER:edushop}
security.jwt.access-token-ttl=PT15M
payment.webhook.secret=${EDUSHOP_PAYMENT_WEBHOOK_SECRET:}

edushop.cors.allowed-origins=${EDUSHOP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.redirect-url=${MOMO_REDIRECT_URL:}
payment.momo.ipn-url=${MOMO_IPN_URL:}
payment.momo.production-enabled=${MOMO_PRODUCTION_ENABLED:false}

# Password reset email: supply credentials only through local environment.
spring.mail.host=${EDUSHOP_MAIL_HOST:}
spring.mail.port=${EDUSHOP_MAIL_PORT:587}
spring.mail.username=${EDUSHOP_MAIL_USERNAME:}
spring.mail.password=${EDUSHOP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${EDUSHOP_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${EDUSHOP_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${EDUSHOP_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
edushop.mail.from=${EDUSHOP_MAIL_FROM:${EDUSHOP_MAIL_USERNAME:}}

# Local-only mail overrides when launched from backend/.
# Local credentials are imported by the dev profile, after its defaults.

payment.zalopay.app-id=${ZALOPAY_APP_ID:0}
payment.zalopay.key1=${ZALOPAY_KEY1:}
payment.zalopay.key2=${ZALOPAY_KEY2:}
payment.zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:5173/payment/zalopay-return}
payment.zalopay.callback-url=${ZALOPAY_CALLBACK_URL:}
payment.zalopay.public-demo=${ZALOPAY_PUBLIC_DEMO:false}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
edushop.media.dir=${EDUSHOP_MEDIA_DIR:../.local/uploads}
